# Host the telemetry receiver.
#   docker compose up -d --build
# Data (SQLite store + request log) persists in ./otel-data on the host.
services:
  receiver:
    build: .
    image: cyclotron/billing-otel-receiver
    restart: unless-stopped
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-data:/data
    environment:
      OTEL_DB: /data/otel.db
      RECEIVER_LOG: /data/receiver.log

  # Sync worker: refresh the current month's invoices + ship CSVs to external
  # storage (ADLS Gen2 / OneLake), self-pacing at the cadence in SYNC_FREQUENCY
  # (hourly/daily/weekly/monthly). Long-running; shares the receiver's volume so
  # it reads the same otel.db. Config + auth come from .env (see .env.example).
  #
  # Prefer precise cron timing instead? Drop `--loop`, keep this out of `up`, and
  # fire `docker compose run --rm sync` from cron (see: scheduler --emit-cron).
  sync:
    build: .
    image: cyclotron/billing-otel-receiver
    restart: unless-stopped
    volumes:
      - ./otel-data:/data
    env_file:
      - .env
    environment:
      OTEL_DB: /data/otel.db
    command: ["python", "-m", "billing.otel.scheduler", "--loop"]

  # TLS
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["443:443"]
    command: caddy reverse-proxy --from otel-billing-receiver.westus2.cloudapp.azure.com --to receiver:4318
    depends_on: [receiver]
